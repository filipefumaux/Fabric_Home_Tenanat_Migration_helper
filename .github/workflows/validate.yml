name: Validate public notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build notebooks
        run: python v2\build.py
      - name: Test publication guards
        run: python tools\test_check_public.py
      - name: Check publication safety
        run: python tools\check_public.py
      - name: Check reproducible notebooks
        run: git --no-pager diff --exit-code -- v2/out
      - name: Run five fake suites
        shell: pwsh
        run: |
          $suites = @('tests.py', 'backup_tests.py', 'agent_tests.py', 'testitems_tests.py', 'e2e_tests.py')
          foreach ($suite in $suites) {
            $output = & python "v2\test\$suite" 2>&1
            $code = $LASTEXITCODE
            $output | Write-Output
            if ($code -ne 0 -or -not ($output -match '^RESULT: ALL PASSED$')) {
              throw "$suite failed (exit $code or missing ALL PASSED result)"
            }
          }
